<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ダーツランチ</title><style>body{margin:0;background:#101827;color:white;text-align:center;font-family:system-ui,sans-serif}main{max-width:500px;margin:auto;padding:18px}h1{font-size:30px}.stage{position:relative;width:min(90vw,400px);height:min(90vw,400px);margin:22px auto}.board{width:100%;height:100%;animation:spin 1.35s linear infinite}.board svg{width:100%;height:100%}@keyframes spin{to{transform:rotate(360deg)}}.dart{position:absolute;left:50%;top:20%;font-size:50px;opacity:0;transform:translate(-50%,-50%) scale(0);pointer-events:none}.dart.fly{animation:fly .45s ease-out forwards}@keyframes fly{0%{opacity:0;transform:translate(140px,230px) scale(3)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}button{background:#ffc32a;color:#241800;border:0;border-radius:14px;padding:15px 28px;font-size:22px;font-weight:bold}button:disabled{opacity:.5}#result{font-size:24px;color:#ffcf4a;font-weight:bold;min-height:64px}section{background:#202d40;border-radius:20px;padding:18px;margin-top:28px;text-align:left}textarea{width:95%;min-height:135px;background:#101827;color:white;font-size:17px;border:1px solid #718096;border-radius:10px;padding:8px}section button{font-size:16px;margin-top:10px}p{color:#b8c4d8}</style><main><h1>🎯 ダーツランチ</h1><p>回るダーツ盤に運命の一投！</p><div class="stage"><div class="board" id="board"><svg viewBox="0 0 400 400"><circle cx="200" cy="200" r="194" fill="#263244" stroke="white" stroke-width="4"/><g id="slices"></g><circle cx="200" cy="200" r="22" fill="white"/><circle cx="200" cy="200" r="14" fill="#c83245"/><circle cx="200" cy="200" r="5" fill="white"/></svg></div><div id="dart" class="dart">🎯</div></div><div id="result">今日は何を食べよう？</div><button id="throw">🎯 投げる！</button><p>刺さってから少し回って止まります</p><section><h2>🍽️ ランチの候補</h2><p>1行に1つ（2〜12個）</p><textarea id="items">ラーメン
カレー
そば
定食
パスタ
寿司</textarea><button id="apply">盤を更新</button><p id="error"></p></section></main><script>(function(){const board=document.getElementById('board'),slices=document.getElementById('slices'),dart=document.getElementById('dart'),result=document.getElementById('result'),btn=document.getElementById('throw'),box=document.getElementById('items');let items=['ラーメン','カレー','そば','定食','パスタ','寿司'],busy=false;const colors=['#ffcf4a','#f18a8a','#67d1b5','#8fa9ff','#d5a3ec','#f5aa65','#a6db83','#ec9cbe','#8bd6df','#d9c58a','#b5a4ed','#f1b7a6'];function draw(){let out='',n=items.length;for(let i=0;i<n;i++){let a=-Math.PI/2+i*2*Math.PI/n,b=-Math.PI/2+(i+1)*2*Math.PI/n,m=(a+b)/2;let p=[200+182*Math.cos(a),200+182*Math.sin(a)],q=[200+182*Math.cos(b),200+182*Math.sin(b)];out+='<path d="M200 200 L'+p.join(' ')+' A182 182 0 0 1 '+q.join(' ')+' Z" fill="'+colors[i]+'" stroke="white" stroke-width="2"/>';out+='<text x="'+(200+122*Math.cos(m))+'" y="'+(205+122*Math.sin(m))+'" font-size="14" text-anchor="middle" font-weight="bold" fill="#162033">'+items[i].replace(/&/g,'&amp;').replace(/</g,'&lt;').slice(0,10)+'</text>'}slices.innerHTML=out}function angle(){let s=getComputedStyle(board).transform,m=s.match(/matrix\(([^)]+)\)/);if(!m)return 0;let v=m[1].split(',');return Math.atan2(+v[1],+v[0])*180/Math.PI}btn.onclick=()=>{if(busy)return;busy=true;btn.disabled=true;dart.className='dart fly';result.textContent='投げた！';setTimeout(()=>{let a=angle();board.style.animation='none';board.style.transform='rotate('+a+'deg)';dart.style.opacity='1';dart.style.transform='translate(-50%,-50%) scale(1)';dart.className='dart';let idx=Math.floor(Math.random()*items.length),sector=360/items.length,target=-(idx+.5)*sector,delta=((target-a)%360+360)%360,total=720+delta,start=performance.now();result.textContent='刺さった！ まだ回る…';function frame(now){let t=Math.min(1,(now-start)/1600),ease=1-Math.pow(1-t,3);board.style.transform='rotate('+(a+total*ease)+'deg)';if(t<1)requestAnimationFrame(frame);else{result.textContent='今日のランチは「'+items[idx]+'」！';btn.textContent='🎯 もう一度！';btn.disabled=false;busy=false}}requestAnimationFrame(frame)},500)};document.getElementById('apply').onclick=()=>{if(busy)return;let a=box.value.split(/\n/).map(x=>x.trim()).filter(Boolean);if(a.length<2||a.length>12){document.getElementById('error').textContent='2〜12個にしてください';return}items=a;draw();document.getElementById('error').textContent='';board.style.animation='spin 1.35s linear infinite';board.style.transform='';dart.style.opacity='0';result.textContent='今日は何を食べよう？'};draw()})();</script></html>
